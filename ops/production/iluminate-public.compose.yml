name: iluminate-public-production

services:
  iluminate-public:
    image: ghcr.io/acartin/iluminate-public:${ILUMINATE_IMAGE_TAG:-main}
    container_name: iluminate-public
    restart: unless-stopped
    environment:
      ILUMINATE_PUBLIC_SITE_URL: https://iluminate.space
      NEXT_PUBLIC_ILUMINATE_APP_URL: https://app.iluminate.space
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    networks:
      - web-ingress

networks:
  web-ingress:
    external: true
